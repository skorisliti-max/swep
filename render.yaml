# Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: worker
    name: okx-sweep-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALERT_DATABASE_PATH
        value: /var/data/alert_state.sqlite3
    disk:
      name: okx-sweep-state
      mountPath: /var/data
      sizeGB: 1
    autoDeploy: true
